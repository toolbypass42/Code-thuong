<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mã Hằng Ngày</title>
  <style>
    :root {
      --bg-color: #0a0e17;
      --card-bg: #111827;
      --accent-color: #00d2ff;
      --accent-glow: rgba(0, 210, 255, 0.35);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px var(--accent-glow);
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      color: var(--accent-color);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .code-box {
      background-color: rgba(0, 0, 0, 0.5);
      border: 2px dashed var(--accent-color);
      border-radius: 12px;
      padding: 20px;
      font-size: 1.8rem;
      font-weight: bold;
      letter-spacing: 4px;
      color: #ffffff;
      text-shadow: 0 0 12px var(--accent-color);
      margin-bottom: 20px;
      user-select: all;
    }

    .btn-copy {
      background-color: var(--accent-color);
      color: #0a0e17;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-bottom: 20px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .btn-copy:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .info-group {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Mã Phần Thưởng Hằng Ngày</h1>
    <p class="subtitle">Mỗi ngày tự động hiển thị 1 mã theo thứ tự</p>

    <div class="code-box" id="daily-code">LOADING...</div>

    <button class="btn-copy" onclick="copyCode()">Sao Chép Mã</button>

    <div class="info-group">
      <span>Ngày: <strong id="current-day" style="color: var(--accent-color);">Ngày 1</strong></span>
      <span>Tổng số mã: <strong id="total-codes" style="color: var(--text-main);">9</strong></span>
    </div>
  </div>

  <script>
    const codes = [
      "K8F2M9P4VT", // Ngày 1 (Dòng 1)
      "P4N8Q2Y6KD", // Ngày 2
      "9J3C7V1M8L", // Ngày 3
      "W5T2B9R4HX", // Ngày 4
      "2M8G6K1P9S", // Ngày 5
      "X7L3D9V4B2", // Ngày 6
      "R1P9H5Z3C8", // Ngày 7
      "4V8N2Q6M1K", // Ngày 8
      "Z3T7B1W9F5"  // Ngày 9
    ];

    function updateUI() {
      // 1. Lấy hoặc tạo ngày bắt đầu trong localStorage
      let startDateStr = localStorage.getItem('app_start_date');
      
      if (!startDateStr) {
        // Nếu lần đầu tiên mở web, lưu ngày hôm nay làm Ngày 1
        const today = new Date();
        today.setHours(0, 0, 0, 0); // Đưa về 00:00:00 của ngày hôm nay
        startDateStr = today.toISOString();
        localStorage.setItem('app_start_date', startDateStr);
      }

      // 2. Tính số ngày đã trôi qua kể từ Ngày 1
      const startDate = new Date(startDateStr);
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const diffTime = today.getTime() - startDate.getTime();
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)); // Số ngày đã trải qua (0, 1, 2...)

      // 3. Chọn code tương ứng (vòng lặp lại nếu vượt quá danh sách)
      const codeIndex = diffDays % codes.length;

      // 4. Hiển thị lên giao diện
      document.getElementById('daily-code').innerText = codes[codeIndex];
      document.getElementById('current-day').innerText = `Ngày ${codeIndex + 1}`;
      document.getElementById('total-codes').innerText = codes.length;
    }

    function copyCode() {
      const codeText = document.getElementById('daily-code').innerText;
      navigator.clipboard.writeText(codeText).then(() => {
        const btn = document.querySelector('.btn-copy');
        btn.innerText = "Đã Sao Chép!";
        btn.style.backgroundColor = "#10b981";
        btn.style.color = "#ffffff";
        setTimeout(() => {
          btn.innerText = "Sao Chép Mã";
          btn.style.backgroundColor = "var(--accent-color)";
          btn.style.color = "#0a0e17";
        }, 2000);
      });
    }

    updateUI();
  </script>
</body>
</html>
